; Cypher32 — Heltec Wireless Paper V1.2 (ESP32-S3 + SX1262 + 250x122 e-ink)
;
;   pio run -t upload      flash the device
;   pio device monitor     watch the LORA_DEBUG trace
;
; DNSServer, ESPmDNS, WebServer and Preferences all ship with the Arduino ESP32
; core, so the only external dependencies are RadioLib and the display driver.

[env:heltec_wireless_paper]
platform  = espressif32
board     = heltec_wireless_paper
framework = arduino

lib_deps =
    jgromes/RadioLib @ ^7.1.0
    https://github.com/todd-herbert/heltec-eink-modules.git

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

; Arduino IDE users: open cypher32.ino with all headers in the same folder,
; install RadioLib >= 7.1 and heltec-eink-modules, select
; "Heltec Wireless Paper" as the board.
